name: geostate

services:
  postgis:
    image: postgis/postgis:16-3.4
    platform: linux/amd64  # official image is amd64-only; runs emulated on Apple Silicon
    environment:
      POSTGRES_USER: geostate
      POSTGRES_PASSWORD: geostate
      POSTGRES_DB: geostate
    ports:
      - "5433:5432"  # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init/00_airflow_db.sql:/docker-entrypoint-initdb.d/00_airflow_db.sql:ro
      - ./src/geostate/sql/schema.sql:/docker-entrypoint-initdb.d/10_schema.sql:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP: during first-time init Postgres only listens on the unix
      # socket, so a socket check would report "ready" too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U geostate -d geostate"]
      interval: 5s
      timeout: 5s
      retries: 30

  martin:
    # Vector tile server: publishes every table in the `marts` schema as /{table}/{z}/{x}/{y}
    image: ghcr.io/maplibre/martin:v0.14.2
    command: ["--config", "/config/martin.yaml"]
    restart: unless-stopped
    volumes:
      - ./docker/martin.yaml:/config/martin.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      postgis:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:25.8  # LTS
    environment:
      CLICKHOUSE_USER: geostate
      CLICKHOUSE_PASSWORD: geostate
      CLICKHOUSE_DB: geostate
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP interface (clickhouse-connect)
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user geostate --password geostate -q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  airflow:
    # Single-container Airflow (`standalone`: api-server + scheduler + dag-processor + triggerer)
    # with LocalExecutor; metadata in its own database on the Postgres server. Local dev only:
    # in production each component runs separately (Helm chart on Kubernetes).
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: geostate-airflow:local
    command: standalone
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgis:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"  # no login, local only
      GEOSTATE_PG_DSN: postgresql://geostate:geostate@postgis:5432/geostate
      GEOSTATE_CH_HOST: clickhouse
      GEOSTATE_DATA_DIR: /opt/geostate/data
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - geodata:/opt/geostate/data
    depends_on:
      postgis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - martin

volumes:
  pgdata:
  chdata:
  geodata:
