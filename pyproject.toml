[project]
name = "geostate"
version = "0.1.0"
description = "Geospatial real-estate price pipeline: listings -> PostGIS -> H3 honeycomb -> vector tiles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "rdata>=0.11",
    "h3>=4.1",
    "shapely>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
]

[project.scripts]
geostate = "geostate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geostate"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vault"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running PostGIS (make up)"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
